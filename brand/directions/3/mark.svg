        stroke-width="10.5" stroke-linecap="butt"/>
  <circle cx="27.5" cy="30" r="4.8" fill="#F0C24B"/>
  <rect x="9" y="50.5" width="46" height="5" rx="2.5" fill="currentColor" opacity="0.4"/>
  <circle cx="13.5" cy="53" r="5" fill="currentColor"/>
  <circle cx="27.5" cy="53" r="6.3" fill="#F0C24B"/>
  <circle cx="41.5" cy="53" r="5" fill="currentColor"/>
  <circle cx="55.5" cy="53" r="5" fill="currentColor"/>
</svg>
