<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Noctua">
  <title>Noctua — the watcher over the lane</title>
  <desc>One open eye — the O of OWL, hooded like Athene noctua's — above a lane of stages. The pupil is off centre because it is looking at the stage the orchestrator is running.</desc>
