  <circle cx="20" cy="35" r="9.6" fill="none" stroke="currentColor" stroke-width="7.3"/>
  <path d="M 44 25.6 L 52.31 30.4 L 52.31 39.6 L 44 44.4 L 35.69 39.6 L 35.69 30.4 Z"
        fill="none" stroke="currentColor" stroke-width="7.3" stroke-linejoin="round"/>
  <path d="M 27.8 46.8 L 36.2 46.8 L 32 56.2 Z" fill="currentColor"/>
</svg>
