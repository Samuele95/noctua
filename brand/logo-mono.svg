<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Noctua">
  <title>Noctua — single colour</title>
  <desc>The mark in one colour, for stamps, embossing and single-ink print. The iris drops out;
        the idea survives in the pair of apertures — one drawn as a circle, one as a polygon.</desc>
